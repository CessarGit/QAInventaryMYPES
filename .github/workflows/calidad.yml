# Integración continua: semáforo de la Tabla 18 del informe.
#
#   Verde  = los jobs "sintaxis" y "pruebas" pasan        → el cambio se integra.
#   Rojo   = algún job falla (o hay un defecto crítico)   → se bloquea la integración
#            hasta corregirlo (checks obligatorios en la protección de main).
#   Ámbar  = pruebas en verde con casos excluidos por defecto abierto
#            (--exclude-group defecto-abierto, decisión D-06) o cobertura bajo el umbral
#            → se integra solo con aprobación del responsable y el riesgo registrado.
#
# Umbral de cobertura: al menos 60 % en Orders y Products (Tabla 13 de PHVA y
# Tabla 19), medida con pcov y publicada en el resumen del job.
# PHPUnit 9.6 con ci-phpunit-test 3 (PHP 7.4, Tabla 2); datos: stock.sql + PC-0.

name: calidad

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sintaxis:
    name: sintaxis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: php -l sobre application/
        run: |
          total=0
          errores=0
          while IFS= read -r -d '' archivo; do
            total=$((total + 1))
            if ! salida=$(php -l "$archivo" 2>&1); then
              errores=$((errores + 1))
              echo "::error file=${archivo}::${salida}"
            fi
          done < <(find application -name '*.php' -print0)
          echo "Archivos revisados: ${total}; con error de sintaxis: ${errores}"
          {
            echo "### Sintaxis (PHP 7.4)"
            echo "Archivos revisados: ${total}; con error: ${errores}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$errores" -eq 0

  pruebas:
    name: pruebas
    runs-on: ubuntu-24.04
    services:
      mysql:
        # Misma versión que el staging (Tabla 2).
        image: mysql:5.7.44
        env:
          MYSQL_DATABASE: stock_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Valores desechables: la base solo existe dentro del runner y se destruye al
      # terminar; no coinciden con staging ni producción (Tabla 13 de seguridad).
      CI_ENV: testing
      DB_HOST: 127.0.0.1
      DB_NAME: stock_test
      DB_USER: ci
      DB_PASS: ci
      ENCRYPTION_KEY: ci-clave-desechable-0000000000000
    steps:
      - uses: actions/checkout@v4

      - name: Detectar la suite de pruebas
        id: suite
        run: |
          if [ -f application/tests/phpunit.xml ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sin suite todavía
        if: steps.suite.outputs.existe != 'true'
        run: |
          echo "Sin suite todavía (paso 5)"
          echo "### Pruebas: Sin suite todavía (paso 5)" >> "$GITHUB_STEP_SUMMARY"

      - uses: shivammathur/setup-php@v2
        if: steps.suite.outputs.existe == 'true'
        with:
          php-version: '7.4'
          extensions: mysqli, pdo_mysql
          coverage: pcov
          tools: composer

      - name: Instalar dependencias
        if: steps.suite.outputs.existe == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Cargar stock.sql y PC-0 en stock_test
        if: steps.suite.outputs.existe == 'true'
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root stock_test < stock.sql
          hash=$(php -r 'echo password_hash("ci-prueba-desechable", PASSWORD_DEFAULT);')
          { printf "SET @pc0_hash = '%s';\n" "$hash"; cat application/tests/_datos/pc0.sql; } \
            | mysql -h 127.0.0.1 -uroot -pci-root stock_test

      - name: Ejecutar PHPUnit (D-06 excluye defecto-abierto)
        if: steps.suite.outputs.existe == 'true'
        working-directory: application/tests
        run: |
          ../../vendor/bin/phpunit --exclude-group defecto-abierto --coverage-text | tee salida.txt
          { echo "### Pruebas (PHPUnit 9.6, stock_test)"; echo '```'; tail -20 salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
