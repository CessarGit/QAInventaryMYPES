# Actualizaciones de dependencias de Composer.
# PHPUnit se limita a la serie 9: las versiones 10 en adelante exigen PHP >= 8.1 y el
# sistema usa PHP 7.4.33 (Tabla 2). Revisar al actualizar PHP.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">=10"]
