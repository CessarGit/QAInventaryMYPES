# Solicitudes de mantenimiento.
# Respaldo: Tabla 11 de mantenimiento (categorías), Figura 1 de mantenimiento
# (cada solicitud es una issue clasificada por categoría y severidad, se
# implementa en una rama y se despliega tras regresión, revisión y firma SQA),
# Tabla 12 de mantenimiento (gestión de solicitudes y de la deuda técnica),
# Tabla 13 de mantenimiento (distribución por categoría) y Tabla 17, punto 7.
name: Mantenimiento
description: Solicitar un cambio correctivo, adaptativo, perfectivo o preventivo.
title: "[Mantenimiento] "
body:
  - type: markdown
    attributes:
      value: |
        **Antes de enviar:** asigna un responsable y aplica la etiqueta `tipo:*` de la
        categoría elegida y la `sev:*` de su prioridad (Figura 1 de mantenimiento).
        Los defectos encontrados al ejecutar un caso de prueba se registran con la
        plantilla **Defecto**.

  - type: dropdown
    id: categoria
    attributes:
      label: Categoría
      description: |
        Tabla 11 de mantenimiento.
        correctivo: corregir un defecto (p. ej., descuento de stock incorrecto).
        adaptativo: adaptarse al entorno (p. ej., CodeIgniter 3.1.13, PHP, MySQL).
        perfectivo: mejorar o ampliar (p. ej., reportes por período); fuera del alcance de la iteración 1.
        preventivo: reducir riesgo futuro (p. ej., centralizar la autorización, suite de PHPUnit).
      options:
        - correctivo
        - adaptativo
        - perfectivo
        - preventivo
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad o severidad
      options:
        - crítica
        - alta
        - media
        - baja
    validations:
      required: true

  - type: textarea
    id: justificacion
    attributes:
      label: Justificación
      description: Situación actual, evidencia (ruta/archivo.php:línea) y riesgo de no atenderla.
    validations:
      required: true

  - type: dropdown
    id: modulos
    attributes:
      label: Módulos afectados
      description: Módulos de la matriz de roles (Tabla 5).
      multiple: true
      options:
        - Users
        - Groups
        - Settings
        - Brands
        - Categories
        - Attributes
        - Stores
        - Products
        - Orders
        - Reports
        - Company
        - Profile
        - Infraestructura (Docker, CI, dependencias)
        - Documentación
    validations:
      required: true

  - type: input
    id: tabla
    attributes:
      label: Tabla del informe que lo respalda
      description: Tabla, figura o hallazgo del informe (docs/calidad/fuente-informe.md).
      placeholder: "Tabla 11 de mantenimiento; Tabla 8 de Top-Down (H-01)"
    validations:
      required: true

  - type: checkboxes
    id: alcance
    attributes:
      label: Alcance
      options:
        - label: No introduce funcionalidad nueva (exclusión del alcance del informe).
          required: true
        - label: Es deuda técnica (versiones antiguas, autorización repetida, falta de pruebas; Tabla 12 de mantenimiento).
