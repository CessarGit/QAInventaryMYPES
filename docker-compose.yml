services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Solo los usa CI_ENV=testing (application/config/testing/database.php).
      # La app normal sigue usando application/config/database.php.
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: test
      DB_PASS: test
      DB_NAME: stock_test
      # Clave de cifrado fuera del código (Fase 4). Cámbiala por 32 caracteres aleatorios.
      CI_ENCRYPTION_KEY: cambia-esta-clave-de-32-caracteres

  db:
    image: mysql:5.7
    container_name: inventory_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stock
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: stock_user
      MYSQL_PASSWORD: secret
    ports:
      - "33062:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Se importan automáticamente SOLO cuando el volumen se crea por primera vez
      - ./stock.sql:/docker-entrypoint-initdb.d/00-stock.sql
      - ./docker/mysql/01-stock-test.sql:/docker-entrypoint-initdb.d/01-stock-test.sql

volumes:
  dbdata:
