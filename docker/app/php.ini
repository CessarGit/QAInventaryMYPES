; Configuración PHP de staging.

; Cobertura con pcov (Tabla 13 de PHVA y Tabla 19: cobertura >= 60 %).
pcov.enabled = 1
pcov.directory = /var/www/html/InventorySystem/application

; CodeIgniter usa sess_driver=files con sess_save_path=NULL (config.php:383):
; toma esta ruta. Sin ella el inicio de sesión falla.
session.save_path = /tmp

; Errores sin detalles técnicos al usuario (L1, pregunta 7); se registran en el log.
display_errors = Off
log_errors = On
error_log = /dev/stderr

date.timezone = America/Lima
